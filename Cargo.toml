[package]
name = "tomos-display-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A lightweight, session-aware Linux display manager foundation for TomOS"
license = "MIT"
repository = "https://github.com/Spruhantom/Tomos-display-manager"

[[bin]]
name = "tdm"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
