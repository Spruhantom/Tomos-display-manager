[package]
name = "tomos-display-manager"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "A lightweight Rust display-manager and graphical greeter foundation for TomOS"
license = "MIT"
repository = "https://github.com/Spruhantom/Tomos-display-manager"

[[bin]]
name = "tdm"
path = "src/main.rs"

[[bin]]
name = "tdm-greeter"
path = "src/bin/greeter.rs"

[dependencies]
gtk4 = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
